name: Pane
options:
  bundleIdPrefix: com.enzo
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  CodeEditLanguages:
    url: https://github.com/CodeEditApp/CodeEditLanguages.git
    exactVersion: 0.1.21
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter.git
    exactVersion: 0.9.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Pane:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: CodeEditLanguages
      - package: SwiftTreeSitter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzo.Pane
        PRODUCT_NAME: Pane
        INFOPLIST_KEY_CFBundleDisplayName: Pane
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Enzo"
        CODE_SIGNING_ALLOWED: NO
  PaneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Pane
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzo.PaneTests
        CODE_SIGNING_ALLOWED: NO
schemes:
  Pane:
    build:
      targets:
        Pane: all
        PaneTests: [test]
    test:
      targets:
        - PaneTests
